[project]
name = "sre-patrol-agent"
version = "0.1.0"
description = "Kubernetes namespace 自動巡檢 Agent（deepagents + MCP）"
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.7.39",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.7.10",
    "langgraph-cli[inmem]>=0.4.0",
    "langgraph-sdk>=0.2.0",
    "mcp>=2.3,<3",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6.1",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["E501"]
